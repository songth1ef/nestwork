<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for og.png / og-zh.png (1200x630). Open with ?lang=zh for the Chinese card. See README. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body { position: relative; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif; color: #f2f2f2; }
  .floor { position: absolute; left: -40%; right: -40%; bottom: -10%; height: 70%;
    background-image: linear-gradient(rgba(63,182,196,.28) 1px, transparent 1px), linear-gradient(90deg, rgba(63,182,196,.28) 1px, transparent 1px);
    background-size: 56px 56px; transform: perspective(460px) rotateX(64deg); transform-origin: top center;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 45%); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.4px); background-size: 20px 20px;
    -webkit-mask-image: radial-gradient(ellipse at 80% 15%, #000, transparent 65%); }
  svg { position: absolute; inset: 0; }
  .badge { position: absolute; left: 72px; top: 64px; background: #3fb6c4; color: #000; font-weight: 800; font-size: 34px; letter-spacing: -.03em;
    padding: 2px 14px 5px; border: 3px solid #000; outline: 3px solid #3fb6c4; }
  .kicker { position: absolute; right: 72px; top: 78px; font-family: Menlo, monospace; font-size: 17px; letter-spacing: .12em; color: #5fd3d9; text-transform: uppercase; }
  h1 { position: absolute; left: 68px; top: 170px; font-size: 148px; font-weight: 800; letter-spacing: -.05em; line-height: .9; }
  h1 .g { text-shadow: -5px 0 #ff2d8f, 5px 0 #29c6ec; }
  .sub { position: absolute; left: 72px; bottom: 62px; font-size: 25px; font-weight: 700; max-width: 700px; line-height: 1.4; }
  .sub .hl { background: #3fb6c4; color: #000; padding: 0 8px; }
  .tools { position: absolute; right: 72px; top: 120px; font-family: Menlo, monospace; font-size: 15px; color: #9a9a9a; text-align: right; line-height: 1.7; letter-spacing: .06em; }
  [data-lang] { display: none; }
  html.en [data-lang="en"], html.zh [data-lang="zh"] { display: block; }
</style>
</head>
<body>
<div class="floor"></div>
<div class="dots"></div>
<svg viewBox="0 0 1200 630"><path d="M800 650 L930 590 L1040 604 L1210 520" fill="none" stroke="#e0242b" stroke-width="3" stroke-dasharray="12 10" opacity=".8"/><rect x="922" y="582" width="16" height="16" fill="none" stroke="#e0242b" stroke-width="3"/><rect x="1032" y="596" width="16" height="16" fill="none" stroke="#5fd3d9" stroke-width="3"/></svg>
<div class="badge">nestwork</div>
<div class="kicker">git-native agent memory</div>
<h1 data-lang="en">Your agents<br><span class="g" data-t="remember.">remember.</span></h1>
<h1 data-lang="zh" style="font-size:132px">你的 agent<br><span class="g" data-t="记得住了。">记得住了。</span></h1>
<p class="sub" data-lang="en">One <span class="hl">private git repo</span> as shared memory for every AI coding agent — across sessions, machines and vendors.</p>
<p class="sub" data-lang="zh">一个<span class="hl">私有 git 仓库</span>，成为所有 AI 编程 agent 的共享长期记忆，跨会话、跨机器、跨厂商。</p>
<div class="tools">Claude Code · Codex · Gemini<br>Kimi · Hermes · OpenClaw</div>
<script>document.documentElement.className = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';</script>
</body>
</html>
