<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for og.png / og-zh.png (1200x630). Open with ?lang=zh for the Chinese card. See README. -->
<style>
  @font-face { font-family: "Inter Tight"; src: url("../fonts/inter-tight-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: -apple-system, "Helvetica Neue", Arial, "PingFang SC", sans-serif; color: #0f172a;
    background: radial-gradient(900px 480px at 85% -10%, rgba(56,189,248,.28), transparent 60%), radial-gradient(700px 420px at 0% 0%, rgba(14,165,183,.18), transparent 60%), radial-gradient(600px 380px at 100% 100%, rgba(236,72,153,.16), transparent 60%), linear-gradient(180deg, #f3fbff, #fff); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(14,165,183,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(14,165,183,.08) 1px, transparent 1px); background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse 70% 70% at 70% 30%, #000 30%, transparent 75%); }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; font-family: "Inter Tight", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.03em; }
  .brand i { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(100deg, #0ea5b7, #38bdf8 45%, #ec4899); }
  .kicker { position: absolute; left: 72px; top: 170px; font-size: 18px; font-weight: 700; letter-spacing: .16em; color: #0ea5b7; }
  h1 { position: absolute; left: 68px; top: 206px; font-family: "Inter Tight", sans-serif; font-size: 118px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  :lang(zh) h1, html.zh h1 { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 104px; letter-spacing: -.01em; line-height: 1.12; }
  .g { background: linear-gradient(100deg, #0ea5b7, #38bdf8 45%, #ec4899); -webkit-background-clip: text; color: transparent; }
  .sub { position: absolute; left: 72px; bottom: 64px; font-size: 25px; color: #334155; max-width: 760px; line-height: 1.45; }
  .pill { position: absolute; right: 72px; bottom: 70px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .pill span { background: #fff; border: 1px solid rgba(15,23,42,.1); border-radius: 999px; padding: 8px 16px; font-size: 17px; font-weight: 600; color: #334155; box-shadow: 0 10px 30px -12px rgba(15,23,42,.2); }
  [data-lang] { display: none; }
  html.en [data-lang="en"], html.zh [data-lang="zh"] { display: block; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="brand"><i></i>nestwork</div>
<div class="kicker" data-lang="en">AI AGENT MEMORY · GIT-NATIVE</div>
<div class="kicker" data-lang="zh">AI AGENT 记忆 · GIT 原生</div>
<h1 data-lang="en">Your agents<br><span class="g">remember.</span></h1>
<h1 data-lang="zh">你的 agent<br><span class="g">记得住了。</span></h1>
<p class="sub" data-lang="en">One private git repo as shared, persistent memory for Claude Code, Codex, Gemini and Kimi.</p>
<p class="sub" data-lang="zh">一个私有 git 仓库，成为 Claude Code、Codex、Gemini、Kimi 共享的长期记忆。</p>
<div class="pill"><span>No server</span><span>No plugin</span><span>Plain markdown + git</span></div>
<script>document.documentElement.className = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';</script>
</body>
</html>
